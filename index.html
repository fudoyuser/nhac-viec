<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhắc việc</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nhắc việc">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #111827; --muted: #6b7280; --line: #e5e7eb; --soft: #eef2ff; --soft-text: #3730a3;
    --primary: #2563eb; --red: #dc2626; --orange: #ea580c; --yellow: #ca8a04; --green: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b21; --text: #e5e7eb; --muted: #9ca3af; --line: #2a2f38; --soft: #1e2440; --soft-text: #c7d2fe; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 24px; white-space: nowrap; }
  header button { white-space: nowrap; }
  @media (max-width: 520px) { h1 { font-size: 20px; } header button { padding: 7px 10px; } }
  button, select { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.danger { color: var(--red); }
  button.sm { padding: 4px 10px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  select { width: 100%; background: var(--bg); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 13px; color: var(--muted); }
  .task { border-left: 4px solid var(--muted); }
  .task.overdue { border-left-color: var(--red); }
  .task.today { border-left-color: var(--orange); }
  .task.soon { border-left-color: var(--yellow); }
  .task.done { border-left-color: var(--green); opacity: .7; }
  .task.done .title { text-decoration: line-through; }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .title { font-weight: 600; word-break: break-word; }
  .meta { font-size: 13px; color: var(--muted); }
  .meta .late { color: var(--red); font-weight: 600; }
  .note { font-size: 14px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; background: var(--soft); color: var(--soft-text); margin-right: 4px; vertical-align: 1px; font-weight: 500; }
  .tag.high { background: #fee2e2; color: #991b1b; }
  .tag.low { background: var(--line); color: var(--muted); }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .progress { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pbar { flex: 1 1 120px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--primary); border-radius: 4px; }
  .pval { width: 40px; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
  .checklist { list-style: none; padding: 0; margin: 8px 0 0; }
  .checklist li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; font-size: 14px; cursor: pointer; }
  .checklist input { width: 18px; height: 18px; margin: 2px 0 0; flex-shrink: 0; cursor: pointer; }
  .checklist li.ok span { text-decoration: line-through; color: var(--muted); }
  .checklist .due { font-size: 12px; color: var(--muted); white-space: nowrap; margin-left: 2px; }
  .checklist .due.late { color: var(--red); font-weight: 600; }
  .checklist .due.today { color: var(--orange); font-weight: 600; }
  .meta .sub { display: block; }
  .item-row { display: grid; grid-template-columns: 22px 1fr 145px 130px 34px; gap: 6px; align-items: center; margin-top: 6px; }
  .item-row .i-time { display: flex; align-items: center; gap: 2px; }
  .item-row .i-time select { padding: 7px 4px; }
  .item-row input[type=checkbox] { width: 18px; height: 18px; margin: 0; }
  .item-row button { padding: 6px 0; }
  @media (max-width: 520px) {
    .item-row { grid-template-columns: 22px minmax(0, 1fr) auto 34px; }
    .item-row .i-text { grid-column: 2 / 4; }
    .item-row .i-date { grid-column: 2 / 3; grid-row: 2; min-width: 0; }
    .item-row .i-time { grid-column: 3 / 5; grid-row: 2; }
    .item-row .i-time select { width: 58px; }
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 12px; }
  @media (max-width: 520px) { .grid2, .grid3 { grid-template-columns: 1fr 1fr; } }
  .bar { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: #fee2e2; color: #991b1b; }
  .msg.ok { background: #dcfce7; color: #166534; }
  .hidden { display: none !important; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .chips { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; padding-bottom: 2px; }
  .chips button { white-space: nowrap; border-radius: 999px; font-size: 14px; padding: 5px 12px; }
  .chips button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chips.groups button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chips button .n { opacity: .7; margin-left: 4px; }
  .tools { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-top: 14px; }
  .tools select { width: auto; background: var(--card); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: var(--primary); color: #fff; }
  @media (max-width: 520px) { .tools { grid-template-columns: 1fr 1fr; } .tools input { grid-column: 1 / -1; } }
  .ghead { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 -4px; }
  .ghead b { font-size: 16px; }
  .ghead span { font-size: 13px; color: var(--muted); }
  small.help { color: var(--muted); font-size: 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 12px; }
  @media (max-width: 520px) { .grid4 { grid-template-columns: 1fr 1fr; } }
  label.chk { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 14px; margin-top: 12px; cursor: pointer; }
  label.chk input { width: 18px; height: 18px; margin: 0; }
  .count { margin-top: 10px; display: grid; gap: 8px; }
  .crow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; }
  .crow .clabel { color: var(--muted); font-size: 13px; min-width: 52px; }
  .crow input.cnum { width: 78px; padding: 4px 8px; text-align: right; font-variant-numeric: tabular-nums; }
  .crow .ctot { margin-right: 4px; }
  .pace { font-size: 13px; color: var(--muted); }
  .pace .late { color: var(--red); font-weight: 600; }
  .pace .ok { color: var(--green); font-weight: 600; }
  .gm-row { display: flex; justify-content: space-between; align-items: center; gap: 6px 8px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .gm-row:last-child { border-bottom: 0; }
  .gm-row span { color: var(--muted); font-size: 13px; margin-left: 6px; }
  /* Lịch */
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .cal-head b { font-size: 17px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
  .cal .dow { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0; }
  .cal .day { min-height: 64px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; overflow: hidden; min-width: 0; }
  .cal .day.out { opacity: .4; }
  .cal .day.today { border-color: var(--primary); }
  .cal .day.sel { outline: 2px solid var(--primary); }
  .cal .num { font-size: 13px; font-weight: 600; }
  .cal .ev { font-size: 11px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--muted); padding-left: 3px; max-width: 100%; }
  .cal .dots { display: none; gap: 3px; flex-wrap: wrap; }
  .cal .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .cal .ev.s-overdue { border-left-color: var(--red); }
  .cal .ev.s-today { border-left-color: var(--orange); }
  .cal .ev.s-soon { border-left-color: var(--yellow); }
  .cal .ev.s-done { border-left-color: var(--green); }
  .cal .dots i.s-overdue { background: var(--red); }
  .cal .dots i.s-today { background: var(--orange); }
  .cal .dots i.s-soon { background: var(--yellow); }
  .cal .dots i.s-done { background: var(--green); }
  @media (max-width: 520px) { .cal .ev { display: none; } .cal .dots { display: flex; } .cal .day { min-height: 48px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📋 Nhắc việc</h1>
    <div style="display:flex;gap:6px">
      <button id="btnGroups">🗂 Nhóm</button>
      <button class="primary" id="btnAdd">+ Thêm việc</button>
    </div>
  </header>

  <div id="msg" class="msg"></div>

  <div id="form" class="card hidden">
    <b id="formTitle">Thêm việc</b>
    <label>Tên công việc</label>
    <input id="fTitle" maxlength="200">
    <div class="grid2">
      <div>
        <label>Nhóm</label>
        <select id="fGroupSel"></select>
        <input id="fGroupNew" class="hidden" maxlength="50" placeholder="Tên nhóm mới" style="margin-top:6px">
      </div>
      <div>
        <label>Ưu tiên</label>
        <select id="fPriority">
          <option value="high">🔥 Cao</option>
          <option value="normal" selected>Bình thường</option>
          <option value="low">Thấp</option>
        </select>
      </div>
    </div>
    <div class="grid3">
      <div><label>Deadline</label><input id="fDeadline" type="date"></div>
      <div>
        <label>Giờ (tùy chọn, 24h)</label>
        <div style="display:flex;align-items:center;gap:4px">
          <select id="fHour" aria-label="Giờ"></select><b>:</b><select id="fMin" aria-label="Phút"></select>
        </div>
      </div>
      <div>
        <label>Lặp lại</label>
        <select id="fRepeat">
          <option value="">Không</option>
          <option value="daily">Hằng ngày</option>
          <option value="weekly">Hằng tuần</option>
          <option value="monthly">Hằng tháng</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div><label>Nhắc gấp trước (ngày)</label><input id="fRemind" type="number" min="0" max="60" value="3"></div>
      <div>
        <label>Đo tiến độ bằng</label>
        <select id="fMeasure">
          <option value="">Phần trăm (%)</option>
          <option value="count">Số lượng (trang, tập, phút…)</option>
        </select>
      </div>
    </div>
    <div id="fPctBox">
      <label>Tiến độ: <span id="fProgVal">0%</span></label>
      <input id="fProgress" type="range" min="0" max="100" step="5" value="0" style="padding:0;margin-top:4px">
    </div>
    <div id="fCountBox" class="hidden">
      <div class="grid4">
        <div><label id="fCurLabel">Đang ở</label><input id="fCur" type="number" min="0" step="any" value="0" inputmode="decimal"></div>
        <div><label>Tổng</label><input id="fTotal" type="number" min="1" step="any" placeholder="228" inputmode="decimal"></div>
        <div><label>Đơn vị</label><input id="fUnit" list="unitList" maxlength="20" placeholder="trang"></div>
        <div><label>Mỗi lần bấm +</label><input id="fStep" type="number" min="0" step="any" placeholder="10" inputmode="decimal"></div>
      </div>
      <label class="chk"><input type="checkbox" id="fSubOn"> Theo dõi thêm phần đang dở (ví dụ: phút của tập đang xem)</label>
      <div id="fSubBox" class="grid4 hidden">
        <div><label id="fSubCurLabel">Đang ở</label><input id="fSubCur" type="number" min="0" step="any" value="0" inputmode="decimal"></div>
        <div><label>Dài</label><input id="fSubTotal" type="number" min="1" step="any" placeholder="48" inputmode="decimal"></div>
        <div><label>Đơn vị</label><input id="fSubUnit" list="unitList" maxlength="20" placeholder="phút"></div>
        <div><label>Mỗi lần bấm +</label><input id="fSubStep" type="number" min="0" step="any" placeholder="5" inputmode="decimal"></div>
      </div>
      <small class="help" id="fCountHelp" style="display:block;margin-top:6px"></small>
    </div>
    <datalist id="unitList">
      <option value="trang"><option value="tập"><option value="phút"><option value="chương"><option value="bài">
      <option value="giờ"><option value="km"><option value="lần"><option value="câu"><option value="video">
    </datalist>
    <label>Việc con (không bắt buộc)</label>
    <div id="fItems"></div>
    <button class="sm" id="fItemAdd" type="button" style="margin-top:8px">+ Thêm việc con</button>
    <small class="help" style="display:block;margin-top:4px">Mỗi việc con có thể có deadline riêng. Khi có việc con, tiến độ tự tính theo số mục đã tích. Nhấn Enter ở ô tên để thêm dòng mới.</small>
    <label>Ghi chú</label>
    <textarea id="fNote" rows="2"></textarea>
    <div class="bar">
      <button id="fCancel">Hủy</button>
      <button class="primary" id="fSave">Lưu</button>
    </div>
  </div>

  <div id="groupMgr" class="card hidden">
    <div class="row"><b>Nhóm công việc</b><button class="sm" id="gmClose">Đóng</button></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input id="gmNew" maxlength="50" placeholder="Tên nhóm mới, ví dụ: Agriup">
      <button class="primary" id="gmAdd" style="white-space:nowrap">+ Thêm</button>
    </div>
    <div id="gmList"></div>
  </div>

  <div class="chips groups" id="groups"></div>
  <div class="stats" id="stats"></div>

  <div class="tools">
    <input id="search" type="search" placeholder="🔍 Tìm việc…">
    <select id="sort" aria-label="Sắp xếp">
      <option value="urgent">Sắp xếp: Mức gấp</option>
      <option value="priority">Sắp xếp: Ưu tiên</option>
      <option value="deadline">Sắp xếp: Deadline</option>
      <option value="progress">Sắp xếp: Tiến độ</option>
      <option value="title">Sắp xếp: Tên A–Z</option>
    </select>
    <div class="seg" id="view">
      <button data-v="list" class="on">Danh sách</button>
      <button data-v="cal">Lịch</button>
    </div>
  </div>

  <div class="chips" id="filter">
    <button data-f="open" class="on">Chưa xong</button>
    <button data-f="all">Tất cả</button>
    <button data-f="done">Đã xong</button>
  </div>

  <div id="calendar" class="hidden"></div>
  <div id="list"></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // Hai giá trị dưới được GitHub Actions điền vào lúc dựng website (xem .github/workflows/pages.yml)
  const DATA_REPO = "__DATA_REPO__";
  const TOKEN_B64 = "__DATA_TOKEN_B64__";
  const configured = !DATA_REPO.startsWith("__") && !TOKEN_B64.startsWith("__");
  const token = configured ? atob(TOKEN_B64) : "";

  const NO_GROUP = "Chưa phân nhóm";
  const REPEAT_TEXT = { daily: "Hằng ngày", weekly: "Hằng tuần", monthly: "Hằng tháng" };
  const PRIO_RANK = { high: 0, normal: 1, low: 2 };
  const STATUS_RANK = { overdue: 0, today: 1, soon: 2, later: 3, done: 4 };

  const pref = {
    get(k, d) { try { return localStorage.getItem("nv_" + k) || d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("nv_" + k, v); } catch {} },
  };

  let tasks = [];
  let groups = []; // danh sách nhóm đã tạo (kể cả nhóm chưa có việc nào)
  let sha = null;
  let editingId = null;
  let saving = false;
  let filter = "open";
  let group = pref.get("group", "*");
  let sortBy = pref.get("sort", "urgent");
  let view = pref.get("view", "list");
  let query = "";
  let calMonth = null; // ngày 1 của tháng đang xem
  let calSel = null; // "YYYY-MM-DD"

  // ---------- Tiện ích ----------
  function msg(text, type = "ok") {
    const el = $("msg");
    el.textContent = text;
    el.className = "msg show " + type;
    clearTimeout(msg.t);
    if (type === "ok") msg.t = setTimeout(() => el.classList.remove("show"), 3000);
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayStr = () => ymd(new Date());
  const fmt = (s) => (s ? s.split("-").reverse().join("/") : "");
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  const b64encode = (str) => {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    bytes.forEach((b) => (bin += String.fromCharCode(b)));
    return btoa(bin);
  };
  const b64decode = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), (c) => c.charCodeAt(0)));

  // ---------- Quy tắc của một việc ----------
  const items = (t) => (Array.isArray(t.items) ? t.items : []);
  // ----- Đo bằng số lượng (trang, tập, phút…) -----
  const num = (v) => (isFinite(+v) && v !== "" && v !== null ? +v : 0);
  const fmtNum = (n) => String(Math.round(n * 10) / 10).replace(".", ",");
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  const DEFAULT_STEP = { trang: 10, "phút": 5, "tập": 1, "chương": 1, "bài": 1, "giờ": 1, km: 1, "câu": 5 };
  const defaultStep = (unit) => DEFAULT_STEP[(unit || "").trim().toLowerCase()] || 1;
  const isCount = (t) => t.measure === "count" && num(t.total) > 0;
  const hasSub = (t) => isCount(t) && t.sub && num(t.sub.total) > 0;
  const stepOf = (t) => (num(t.step) > 0 ? num(t.step) : defaultStep(t.unit));
  const subStepOf = (t) => (num(t.sub?.step) > 0 ? num(t.sub.step) : defaultStep(t.sub?.unit));
  const subFrac = (t) => (hasSub(t) && num(t.current) < num(t.total) ? Math.min(1, num(t.sub.current) / num(t.sub.total)) : 0);
  const countValue = (t) => Math.min(num(t.total), num(t.current) + subFrac(t));
  const subLabel = (t) => `${cap(t.unit)} ${Math.min(Math.floor(num(t.current)) + 1, Math.ceil(num(t.total)))}`;
  function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }

  // Nhịp độ cần đạt để kịp deadline, và có đang chậm so với kế hoạch không
  function paceInfo(t) {
    if (!isCount(t) || isDone(t) || !t.deadline) return null;
    const remaining = num(t.total) - countValue(t);
    const d = daysLeft(t);
    if (d < 0) return { html: `<span class="late">Đã quá hạn, còn ${fmtNum(remaining)} ${esc(t.unit)}</span>`, perDay: null };
    const days = d + 1;
    const per = remaining / days;
    const perText = per >= 1 ? Math.ceil(per) : fmtNum(per);
    let html = `📈 Cần ~${perText} ${esc(t.unit)}/ngày để kịp deadline`;
    if (t.startDate && t.startDate <= todayStr()) {
      const totalDays = daysBetween(t.startDate, t.deadline) + 1;
      const elapsed = daysBetween(t.startDate, todayStr());
      if (totalDays > 0 && elapsed > 0) {
        const start = num(t.startValue);
        const expected = start + ((num(t.total) - start) * elapsed) / totalDays;
        const gap = expected - countValue(t);
        if (gap >= Math.max(0.5, stepOf(t) / 2)) html += ` · <span class="late">Đang chậm ${gap >= 1 ? Math.ceil(gap) : fmtNum(gap)} ${esc(t.unit)} so với kế hoạch</span>`;
        else html += ` · <span class="ok">Đúng tiến độ ✓</span>`;
      }
    }
    return { html, perDay: per };
  }

  // Áp dụng thao tác đếm lên một việc (dùng chung cho nút trên thẻ, ô nhập và nút trong email)
  function applyCount(x, act, value) {
    const total = num(x.total);
    const sub = hasSub(x) ? x.sub : null;
    const setMain = (v) => {
      const before = num(x.current);
      x.current = Math.max(0, Math.min(total, Math.round(v * 100) / 100));
      if (sub && Math.floor(x.current) !== Math.floor(before)) sub.current = 0;
    };
    if (act === "cplus") setMain(num(x.current) + stepOf(x));
    else if (act === "cminus") setMain(num(x.current) - stepOf(x));
    else if (act === "cset") setMain(value);
    else if (act === "done") { x.current = total; if (sub) sub.current = 0; }
    else if (act === "reopen") setMain(Math.max(0, total - 1));
    else if (sub && (act === "splus" || act === "sset" || act === "snext")) {
      const v = act === "splus" ? num(sub.current) + subStepOf(x) : act === "sset" ? value : num(sub.total);
      if (v >= num(sub.total)) { setMain(Math.floor(num(x.current)) + 1); sub.current = 0; return "next"; }
      sub.current = Math.max(0, Math.round(v * 100) / 100);
    }
  }

  function progressOf(t) {
    if (isCount(t)) {
      if (num(t.current) >= num(t.total)) return 100;
      return Math.min(99, Math.floor((countValue(t) / num(t.total)) * 100));
    }
    const it = items(t);
    if (it.length) {
      if (t.done === true) return 100;
      return Math.min(99, Math.round((it.filter((i) => i.done).length / it.length) * 100));
    }
    return Math.max(0, Math.min(100, +t.progress || 0));
  }
  // Việc có việc con: tích hết việc con KHÔNG có nghĩa là xong việc chính (còn có thể thêm việc con).
  // Việc chính chỉ xong khi bấm ✓ Xong (t.done = true).
  const usesItems = (t) => !isCount(t) && items(t).length > 0;
  const allItemsDone = (t) => items(t).length > 0 && items(t).every((i) => i.done);
  const isDone = (t) => (usesItems(t) ? t.done === true : progressOf(t) >= 100);
  function remindOf(t) {
    const v = t.remindBefore;
    return v === undefined || v === null || v === "" || isNaN(+v) ? 3 : Math.max(0, +v);
  }
  const groupOf = (t) => (t.group || "").trim() || NO_GROUP;
  const prioOf = (t) => (t.priority in PRIO_RANK ? t.priority : "normal");
  const daysTo = (dl) => (dl ? Math.round((parseYmd(dl) - parseYmd(todayStr())) / 86400000) : null);
  const daysLeft = (t) => daysTo(t.deadline);
  function timePassed(t) {
    if (!t.time) return false;
    const [h, m] = t.time.split(":").map(Number);
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes() > h * 60 + m;
  }
  // Mức gấp của một mốc deadline (dùng cho việc chính và từng việc con)
  function statusAt(dl, time, remind) {
    const d = daysTo(dl);
    if (d === null) return "later";
    if (d < 0) return "overdue";
    if (d === 0) return timePassed({ time }) ? "overdue" : "today";
    if (d <= remind) return "soon";
    return "later";
  }
  // Việc con chưa xong có deadline gấp nhất (hoặc null)
  function urgentItem(t) {
    let best = null;
    items(t).forEach((i) => {
      if (i.done || !i.deadline) return;
      if (!best || i.deadline + (i.time || "99:99") < best.deadline + (best.time || "99:99")) best = i;
    });
    return best;
  }
  // Mức gấp của cả việc = mức gấp nhất giữa deadline chính và deadline các việc con chưa xong
  function statusOf(t) {
    if (isDone(t)) return "done";
    let s = statusAt(t.deadline, t.time, remindOf(t));
    const it = urgentItem(t);
    if (it) {
      const si = statusAt(it.deadline, it.time || "", remindOf(t));
      if (STATUS_RANK[si] < STATUS_RANK[s]) s = si;
    }
    return s;
  }
  // Ngày dùng để sắp xếp: sớm nhất giữa deadline chính và deadline việc con chưa xong
  function effDeadline(t) {
    const it = urgentItem(t);
    const main = (t.deadline || "9999-99-99") + (t.time || "99:99");
    const sub = it ? it.deadline + (it.time || "99:99") : "9999-99-99";
    return main < sub ? main : sub;
  }
  // Mô tả hạn của việc con, có giờ nếu có
  function dueText(i) {
    const d = daysTo(i.deadline);
    const at = i.time ? ` ${i.time}` : "";
    if (d < 0) return `quá hạn ${-d} ngày · ${fmt(i.deadline)}${at}`;
    if (d === 0) return timePassed(i) ? `quá hạn từ ${i.time} hôm nay` : `hạn hôm nay${at}`;
    return `còn ${d} ngày · ${fmt(i.deadline)}${at}`;
  }
  const itemLate = (i) => { const d = daysTo(i.deadline); return d < 0 || (d === 0 && timePassed(i)); };
  function whenHtml(t) {
    if (isDone(t)) return "Đã xong";
    const d = daysLeft(t);
    const at = t.time ? ` ${t.time}` : "";
    let main;
    if (d === null) main = "Không có deadline";
    else if (d < 0) main = `<span class="late">Quá hạn ${-d} ngày</span> · ${fmt(t.deadline)}${at}`;
    else if (d === 0) main = timePassed(t) ? `<span class="late">Quá hạn từ ${t.time} hôm nay</span>` : `Hạn hôm nay${at}`;
    else main = `Còn ${d} ngày · ${fmt(t.deadline)}${at}`;
    const it = urgentItem(t);
    if (it) {
      main += `<span class="sub">↳ Việc con gần nhất “${esc(it.text)}”: ${itemLate(it) ? `<span class="late">${dueText(it)}</span>` : dueText(it)}</span>`;
    }
    return main;
  }

  function addPeriod(s, repeat) {
    const d = parseYmd(s);
    if (repeat === "daily") d.setDate(d.getDate() + 1);
    else if (repeat === "weekly") d.setDate(d.getDate() + 7);
    else if (repeat === "monthly") {
      const day = d.getDate();
      d.setDate(1);
      d.setMonth(d.getMonth() + 1);
      d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    }
    return ymd(d);
  }

  // Chạy sau mỗi thay đổi: ghi thời điểm xong, tạo kỳ tiếp theo cho việc lặp lại
  function finalize(list) {
    const now = new Date().toISOString();
    const today = todayStr();
    for (const t of [...list]) {
      if (usesItems(t) && t.done === true && !allItemsDone(t)) t.done = false;
      if (isDone(t)) {
        if (!t.doneAt) t.doneAt = now;
        if (REPEAT_TEXT[t.repeat] && !t.nextCreated) {
          t.nextCreated = true;
          let next = addPeriod(t.deadline || today, t.repeat);
          while (next < today) next = addPeriod(next, t.repeat);
          list.push({
            id: uid(), title: t.title, group: t.group || "", priority: prioOf(t), repeat: t.repeat,
            deadline: next, time: t.time || "", remindBefore: remindOf(t), progress: 0,
            items: items(t).map((i) => {
              const x = { text: i.text, done: false };
              if (i.time) x.time = i.time;
              // dời deadline việc con theo đúng khoảng cách mà việc chính được dời
              if (i.deadline && t.deadline) {
                const d = parseYmd(i.deadline);
                d.setDate(d.getDate() + Math.round((parseYmd(next) - parseYmd(t.deadline)) / 86400000));
                x.deadline = ymd(d);
              }
              return x;
            }),
            note: t.note || "", createdAt: now,
            ...(isCount(t) ? {
              measure: "count", current: 0, total: t.total, unit: t.unit, step: t.step || "",
              sub: hasSub(t) ? { ...t.sub, current: 0 } : null, startDate: today, startValue: 0,
            } : {}),
          });
        }
      } else {
        delete t.doneAt;
      }
    }
  }

  // ---------- Đọc / ghi GitHub ----------
  const apiUrl = () => `https://api.github.com/repos/${DATA_REPO}/contents/tasks.json`;
  const headers = () => ({ Accept: "application/vnd.github+json", Authorization: "Bearer " + token });

  async function fetchRemote() {
    const r = await fetch(apiUrl() + "?t=" + Date.now(), { headers: headers(), cache: "no-store" });
    if (r.status === 404) { tasks = []; groups = []; sha = null; return; }
    if (!r.ok) throw new Error("GitHub API " + r.status);
    const j = await r.json();
    sha = j.sha;
    const data = JSON.parse(b64decode(j.content));
    // Dữ liệu cũ là một mảng việc; dữ liệu mới là { groups, tasks }
    tasks = Array.isArray(data) ? data : data.tasks || [];
    tasks.forEach((t) => { if (usesItems(t) && t.done === undefined && t.doneAt && allItemsDone(t)) t.done = true; });
    groups = Array.isArray(data) ? [] : data.groups || [];
  }

  async function put(label) {
    const body = { message: label, content: b64encode(JSON.stringify({ groups, tasks }, null, 2) + "\n"), ...(sha ? { sha } : {}) };
    const r = await fetch(apiUrl(), { method: "PUT", headers: { ...headers(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) return "conflict";
    if (!r.ok) throw new Error("GitHub API " + r.status + " " + ((await r.json().catch(() => ({}))).message || ""));
    sha = (await r.json()).content.sha;
    return "ok";
  }

  // Áp dụng thay đổi `fn` rồi lưu. Nếu máy khác vừa sửa: tải bản mới, áp lại `fn`, lưu lại.
  // Nếu vẫn thất bại: đưa màn hình về đúng dữ liệu trên GitHub, không để hiện thay đổi chưa lưu.
  async function mutate(fn, label, okText = "Đã lưu ✓") {
    if (!configured) { msg("Website chưa được cấu hình nên không lưu được.", "err"); return false; }
    if (saving) return false;
    const backup = JSON.stringify({ groups, tasks });
    saving = true;
    fn(tasks, groups); finalize(tasks); render();
    try {
      let res = await put(label);
      if (res === "conflict") {
        await fetchRemote();
        fn(tasks, groups); finalize(tasks); render();
        res = await put(label);
        if (res === "conflict") throw new Error("dữ liệu đang được sửa ở nơi khác, thử lại sau ít giây");
      }
      if (okText) msg(okText);
      return true;
    } catch (e) {
      try { await fetchRemote(); } catch { ({ groups, tasks } = JSON.parse(backup)); }
      msg("Chưa lưu được: " + e.message + ". Màn hình đã trở về dữ liệu đã lưu.", "err");
      return false;
    } finally {
      saving = false;
      render();
    }
  }

  const byId = (list, id) => list.find((x) => x.id === id);

  // ---------- Hiển thị ----------
  function groupNames() {
    const names = [...new Set([...groups, ...tasks.map(groupOf)])];
    return names.sort((a, b) => (a === NO_GROUP) - (b === NO_GROUP) || a.localeCompare(b, "vi"));
  }
  const openCount = (list) => list.filter((t) => !isDone(t)).length;

  function matches(t) {
    if (!query) return true;
    const hay = [t.title, t.note, t.group, ...items(t).map((i) => i.text)].join(" ").toLowerCase();
    return query.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
  }

  function compare(a, b) {
    const dl = effDeadline;
    const urgent = () => STATUS_RANK[statusOf(a)] - STATUS_RANK[statusOf(b)];
    const prio = () => PRIO_RANK[prioOf(a)] - PRIO_RANK[prioOf(b)];
    const date = () => dl(a).localeCompare(dl(b));
    switch (sortBy) {
      case "priority": return prio() || urgent() || date();
      case "deadline": return isDone(a) - isDone(b) || date() || prio();
      case "progress": return progressOf(a) - progressOf(b) || urgent() || date();
      case "title": return a.title.localeCompare(b.title, "vi");
      default: return urgent() || prio() || date();
    }
  }

  function renderGroups(names) {
    if (group !== "*" && !names.includes(group)) group = "*";
    const chip = (key, label, n) =>
      `<button data-g="${esc(key)}" class="${group === key ? "on" : ""}">${esc(label)}<span class="n">${n}</span></button>`;
    $("groups").innerHTML =
      names.length > 1 || (names.length === 1 && names[0] !== NO_GROUP)
        ? chip("*", "Tất cả nhóm", openCount(tasks)) + names.map((g) => chip(g, g, openCount(tasks.filter((t) => groupOf(t) === g)))).join("")
        : "";
    renderGroupManager(names);
  }

  const realGroups = () => groupNames().filter((g) => g !== NO_GROUP);

  function renderGroupManager(names) {
    if ($("groupMgr").classList.contains("hidden")) return;
    const list = names.filter((g) => g !== NO_GROUP);
    const dis = saving ? "disabled" : "";
    $("gmList").innerHTML = list.length
      ? list.map((g) => {
          const n = tasks.filter((t) => groupOf(t) === g);
          return `<div class="gm-row" data-name="${esc(g)}">
            <div><b>${esc(g)}</b><span>${n.length} việc${openCount(n) ? ` · ${openCount(n)} chưa xong` : ""}</span></div>
            <div class="actions">
              <button class="sm" data-gm="new" ${dis}>+ Việc</button>
              <button class="sm" data-gm="rename" ${dis}>Đổi tên</button>
              <button class="sm danger" data-gm="del" ${dis}>Xóa</button>
            </div>
          </div>`;
        }).join("")
      : `<div class="empty" style="padding:16px 0">Chưa có nhóm nào. Gõ tên nhóm ở trên rồi bấm “+ Thêm”.</div>`;
  }

  function card(t, showGroup) {
    const s = statusOf(t);
    const p = progressOf(t);
    const it = items(t);
    const dis = saving ? "disabled" : "";
    const tags =
      (prioOf(t) === "high" ? '<span class="tag high">🔥 Cao</span>' : prioOf(t) === "low" ? '<span class="tag low">Thấp</span>' : "") +
      (showGroup && t.group ? `<span class="tag">${esc(t.group)}</span>` : "") +
      (REPEAT_TEXT[t.repeat] ? `<span class="tag">🔁 ${REPEAT_TEXT[t.repeat]}</span>` : "");
    const counting = isCount(t);
    let countBlock = "";
    if (counting) {
      const u = esc(t.unit || "");
      const pace = paceInfo(t);
      countBlock = `<div class="count">
        <div class="crow">
          <span class="clabel">${hasSub(t) ? "Đã xong" : "Đang ở"}</span>
          <input type="number" class="cnum" data-k="main" min="0" max="${num(t.total)}" step="any" inputmode="decimal" value="${num(t.current)}" ${dis} aria-label="Đang ở">
          <span class="ctot">/ ${fmtNum(num(t.total))} ${u}</span>
          ${isDone(t) ? "" : `<button class="sm" data-act="cminus" ${dis}>−${fmtNum(stepOf(t))}</button>
          <button class="sm" data-act="cplus" ${dis}>+${fmtNum(stepOf(t))} ${u}</button>`}
        </div>
        ${hasSub(t) && !isDone(t) ? `<div class="crow">
          <span class="clabel">▶ ${esc(subLabel(t))}</span>
          <input type="number" class="cnum" data-k="sub" min="0" max="${num(t.sub.total)}" step="any" inputmode="decimal" value="${num(t.sub.current)}" ${dis} aria-label="Đang dở">
          <span class="ctot">/ ${fmtNum(num(t.sub.total))} ${esc(t.sub.unit || "")}</span>
          <button class="sm" data-act="splus" ${dis}>+${fmtNum(subStepOf(t))} ${esc(t.sub.unit || "")}</button>
          <button class="sm" data-act="snext" ${dis}>Xong ${esc(t.unit || "")} ✓</button>
        </div>` : ""}
        ${pace ? `<div class="pace">${pace.html}</div>` : ""}
      </div>`;
    }
    const quick = counting
      ? isDone(t)
        ? `<button class="sm" data-act="reopen" ${dis}>Mở lại</button>`
        : `<button class="sm" data-act="done" ${dis}>✓ Xong</button>`
      : it.length
      ? isDone(t)
        ? `<button class="sm" data-act="reopen" ${dis}>Mở lại</button>`
        : `<button class="sm" data-act="done" ${dis}>✓ Xong cả việc</button>`
      : isDone(t)
        ? `<button class="sm" data-act="reopen" ${dis}>Mở lại</button>`
        : `<button class="sm" data-act="minus" ${dis} aria-label="Giảm 10%">−10%</button>
           <button class="sm" data-act="plus" ${dis} aria-label="Tăng 10%">+10%</button>
           <button class="sm" data-act="done" ${dis}>✓ Xong</button>`;
    return `
      <div class="card task ${s}" data-id="${esc(t.id)}">
        <div class="row">
          <div>
            <div class="title">${esc(t.title)}</div>
            ${tags ? `<div style="margin-top:2px">${tags}</div>` : ""}
            <div class="meta">${whenHtml(t)}</div>
          </div>
          <div class="actions">
            <button class="sm" data-act="edit" ${dis}>Sửa</button>
            <button class="sm danger" data-act="del" ${dis}>Xóa</button>
          </div>
        </div>
        ${t.note ? `<div class="note">${esc(t.note)}</div>` : ""}
        ${it.length ? `<ul class="checklist">${it.map((i, n) => `
          <li class="${i.done ? "ok" : ""}" data-act="item" data-n="${n}">
            <input type="checkbox" ${i.done ? "checked" : ""} ${dis} tabindex="-1"><span>${esc(i.text)}${
              i.deadline ? ` <span class="due ${i.done ? "" : itemLate(i) ? "late" : daysTo(i.deadline) === 0 ? "today" : ""}">📅 ${fmt(i.deadline).slice(0, 5)}${i.time ? " " + i.time : ""}</span>` : ""
            }</span>
          </li>`).join("")}</ul>` : ""}
        ${countBlock}
        ${usesItems(t) && allItemsDone(t) && !isDone(t) ? `<div class="pace">✅ Đã xong hết việc con. Thêm việc con mới, hoặc bấm “✓ Xong cả việc” nếu việc này đã hoàn tất.</div>` : ""}
        <div class="progress">
          <div class="pbar"><i style="width:${p}%;background:${p >= 100 ? "var(--green)" : "var(--primary)"}"></i></div>
          <span class="pval">${p}%</span>
          ${quick}
        </div>
      </div>`;
  }

  function visibleTasks() {
    return (group === "*" ? tasks : tasks.filter((t) => groupOf(t) === group)).filter(matches);
  }

  function render() {
    const names = groupNames();
    renderGroups(names);
    const base = visibleTasks();

    const c = { open: 0, overdue: 0, urgent: 0, done: 0 };
    base.forEach((t) => {
      const s = statusOf(t);
      s === "done" ? c.done++ : c.open++;
      if (s === "overdue") c.overdue++;
      if (s === "today" || s === "soon") c.urgent++;
    });
    $("stats").innerHTML = `
      <div class="stat"><b>${c.open}</b><span>Chưa xong</span></div>
      <div class="stat"><b style="color:var(--red)">${c.overdue}</b><span>Quá hạn</span></div>
      <div class="stat"><b style="color:var(--orange)">${c.urgent}</b><span>Sắp đến hạn</span></div>
      <div class="stat"><b style="color:var(--green)">${c.done}</b><span>Đã xong</span></div>`;

    $("filter").classList.toggle("hidden", view === "cal");
    $("calendar").classList.toggle("hidden", view !== "cal");
    if (view === "cal") return renderCalendar(base);

    const shown = base
      .filter((t) => filter === "all" || (filter === "done" ? isDone(t) : !isDone(t)))
      .sort(compare);

    if (!shown.length) {
      $("list").innerHTML = `<div class="empty">${query ? "Không tìm thấy việc nào khớp." : filter === "done" ? "Chưa có việc nào xong." : "Không có việc nào. Bấm “+ Thêm việc” để bắt đầu."}</div>`;
      return;
    }
    if (group === "*" && names.length > 1 && !query) {
      $("list").innerHTML = names.map((g) => {
        const list = shown.filter((t) => groupOf(t) === g);
        if (!list.length) return "";
        const late = list.filter((t) => statusOf(t) === "overdue").length;
        return `<div class="ghead"><b>${esc(g)}</b><span>${list.length} việc${late ? ` · <span style="color:var(--red)">${late} quá hạn</span>` : ""}</span></div>` +
          list.map((t) => card(t, false)).join("");
      }).join("");
    } else {
      $("list").innerHTML = shown.map((t) => card(t, group === "*")).join("");
    }
  }

  function renderCalendar(base) {
    if (!calMonth) { const n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const start = new Date(y, m, 1);
    start.setDate(1 - ((start.getDay() + 6) % 7)); // bắt đầu từ thứ Hai
    const byDay = {};
    const put = (day, t) => { const l = (byDay[day] ||= []); if (!l.includes(t)) l.push(t); };
    base.forEach((t) => {
      if (t.deadline) put(t.deadline, t);
      items(t).forEach((i) => { if (i.deadline && !i.done) put(i.deadline, t); });
    });
    Object.values(byDay).forEach((l) => l.sort(compare));
    const today = todayStr();
    let cells = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const key = ymd(d);
      const list = byDay[key] || [];
      cells += `<button class="day ${d.getMonth() !== m ? "out" : ""} ${key === today ? "today" : ""} ${key === calSel ? "sel" : ""}" data-day="${key}">
        <span class="num">${d.getDate()}</span>
        ${list.slice(0, 3).map((t) => `<span class="ev s-${statusOf(t)}">${esc(t.title)}</span>`).join("")}
        ${list.length > 3 ? `<span class="ev" style="border:0">+${list.length - 3} việc</span>` : ""}
        <span class="dots">${list.slice(0, 6).map((t) => `<i class="s-${statusOf(t)}"></i>`).join("")}</span>
      </button>`;
    }
    $("calendar").innerHTML = `
      <div class="cal-head">
        <button class="sm" data-cal="-1" aria-label="Tháng trước">‹</button>
        <b>Tháng ${m + 1}/${y}</b>
        <span style="display:flex;gap:6px">
          <button class="sm" data-cal="0">Hôm nay</button>
          <button class="sm" data-cal="1" aria-label="Tháng sau">›</button>
        </span>
      </div>
      <div class="cal">${["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map((d) => `<div class="dow">${d}</div>`).join("")}${cells}</div>`;

    const sel = calSel || today;
    const dayList = (byDay[sel] || []).slice();
    const noDl = base.filter((t) => !t.deadline && !urgentItem(t) && !isDone(t));
    $("list").innerHTML =
      `<div class="ghead"><b>${sel === today ? "Hôm nay" : "Ngày " + fmt(sel)}</b><span>${dayList.length} việc</span></div>` +
      (dayList.length ? dayList.map((t) => card(t, true)).join("") : `<div class="empty">Không có việc nào hết hạn ngày này.</div>`) +
      (noDl.length ? `<div class="ghead"><b>Không có deadline</b><span>${noDl.length} việc</span></div>` + noDl.sort(compare).map((t) => card(t, true)).join("") : "");
  }

  // ---------- Form ----------
  function openForm(t) {
    editingId = t ? t.id : null;
    $("formTitle").textContent = t ? "Sửa việc" : "Thêm việc";
    $("fTitle").value = t?.title || "";
    fillGroupSelect(t ? t.group || "" : defaultGroup());
    $("fPriority").value = t ? prioOf(t) : "normal";
    $("fDeadline").value = t?.deadline || (view === "cal" && calSel ? calSel : "");
    setTime(t?.time || "");
    $("fRepeat").value = t?.repeat || "";
    $("fRemind").value = t ? remindOf(t) : 3;
    $("fProgress").value = t ? +t.progress || 0 : 0;
    $("fMeasure").value = t?.measure === "count" ? "count" : "";
    $("fCur").value = t?.measure === "count" ? num(t.current) : 0;
    $("fTotal").value = t?.measure === "count" ? t.total : "";
    $("fUnit").value = t?.measure === "count" ? t.unit || "" : "";
    $("fStep").value = t?.measure === "count" && num(t.step) > 0 ? t.step : "";
    $("fSubOn").checked = !!(t && hasSub(t));
    $("fSubCur").value = t?.sub ? num(t.sub.current) : 0;
    $("fSubTotal").value = t?.sub ? t.sub.total : "";
    $("fSubUnit").value = t?.sub ? t.sub.unit || "" : "";
    $("fSubStep").value = t?.sub && num(t.sub.step) > 0 ? t.sub.step : "";
    $("fItems").innerHTML = "";
    (t ? items(t) : []).forEach((i) => addItemRow(i));
    $("fNote").value = t?.note || "";
    syncProgressField();
    $("form").classList.remove("hidden");
    $("form").scrollIntoView({ behavior: "smooth", block: "start" });
    $("fTitle").focus({ preventScroll: true });
  }
  // Ô chọn giờ 24h (ô type="time" hiển thị SA/CH theo ngôn ngữ máy nên không dùng)
  const MINUTES = Array.from({ length: 12 }, (_, i) => pad(i * 5));
  const HOUR_OPTS = `<option value="">--</option>` + Array.from({ length: 24 }, (_, h) => `<option>${pad(h)}</option>`).join("");
  const minuteOpts = (m) => (m && !MINUTES.includes(m) ? [...MINUTES, m].sort() : MINUTES).map((x) => `<option>${x}</option>`).join("");
  $("fHour").innerHTML = HOUR_OPTS;
  function setTime(v) {
    const [h, m] = v ? v.split(":") : ["", ""];
    const mins = m && !MINUTES.includes(m) ? [...MINUTES, m].sort() : MINUTES;
    $("fMin").innerHTML = mins.map((x) => `<option>${x}</option>`).join("");
    $("fHour").value = h || "";
    $("fMin").value = m || "00";
    $("fMin").disabled = !h;
  }
  const getTime = () => ($("fHour").value ? `${$("fHour").value}:${$("fMin").value}` : "");
  $("fHour").onchange = () => ($("fMin").disabled = !$("fHour").value);

  // Nhóm mặc định khi thêm việc: nhóm đang lọc, nếu không thì nhóm dùng lần trước
  function defaultGroup() {
    if (group !== "*" && group !== NO_GROUP) return group;
    const last = pref.get("lastGroup", "");
    return realGroups().includes(last) ? last : "";
  }
  function fillGroupSelect(value) {
    const list = realGroups();
    if (value && !list.includes(value)) list.push(value);
    $("fGroupSel").innerHTML =
      `<option value="">— Không có nhóm —</option>` +
      list.map((g) => `<option value="${esc(g)}">${esc(g)}</option>`).join("") +
      `<option value="__new__">+ Tạo nhóm mới…</option>`;
    $("fGroupSel").value = value || "";
    $("fGroupNew").value = "";
    $("fGroupNew").classList.add("hidden");
  }
  $("fGroupSel").onchange = () => {
    const isNew = $("fGroupSel").value === "__new__";
    $("fGroupNew").classList.toggle("hidden", !isNew);
    if (isNew) $("fGroupNew").focus();
  };

  // Danh sách việc con trong form: mỗi dòng có ô tích, tên, deadline, nút xóa
  function addItemRow(i = {}, after = null) {
    const row = document.createElement("div");
    row.className = "item-row";
    row.innerHTML = `
      <input type="checkbox" class="i-done" ${i.done ? "checked" : ""} aria-label="Đã xong">
      <input class="i-text" maxlength="200" placeholder="Tên việc con" value="${esc(i.text || "")}">
      <input class="i-date" type="date" value="${esc(i.deadline || "")}" aria-label="Deadline việc con">
      <div class="i-time"><select class="i-h" aria-label="Giờ việc con">${HOUR_OPTS}</select><b>:</b><select class="i-m" aria-label="Phút việc con"></select></div>
      <button type="button" class="i-del" aria-label="Xóa việc con">✕</button>`;
    const [h, m] = i.time ? i.time.split(":") : ["", ""];
    row.querySelector(".i-m").innerHTML = minuteOpts(m);
    row.querySelector(".i-h").value = h || "";
    row.querySelector(".i-m").value = m || "00";
    row.querySelector(".i-m").disabled = !h;
    after ? after.after(row) : $("fItems").append(row);
    return row;
  }
  function readItems() {
    return [...$("fItems").querySelectorAll(".item-row")]
      .map((r) => {
        const x = { text: r.querySelector(".i-text").value.trim(), done: r.querySelector(".i-done").checked };
        const d = r.querySelector(".i-date").value;
        const h = r.querySelector(".i-h").value;
        if (d) x.deadline = d;
        if (d && h) x.time = `${h}:${r.querySelector(".i-m").value}`;
        return x;
      })
      .filter((x) => x.text);
  }
  $("fItemAdd").onclick = () => { addItemRow().querySelector(".i-text").focus(); syncProgressField(); };
  $("fItems").addEventListener("click", (e) => {
    if (e.target.closest(".i-del")) { e.target.closest(".item-row").remove(); syncProgressField(); }
  });
  $("fItems").addEventListener("input", syncProgressField);
  $("fItems").addEventListener("change", (e) => {
    if (e.target.classList.contains("i-h")) e.target.closest(".i-time").querySelector(".i-m").disabled = !e.target.value;
    syncProgressField();
  });
  $("fItems").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || !e.target.classList.contains("i-text")) return;

    addItemRow({}, e.target.closest(".item-row")).querySelector(".i-text").focus();

  // Dán nhiều dòng vào ô tên: mỗi dòng thành một việc con
  $("fItems").addEventListener("paste", (e) => {
    if (!e.target.classList.contains("i-text")) return;
    const lines = (e.clipboardData?.getData("text") || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    if (lines.length < 2) return;
    e.preventDefault();
    let row = e.target.closest(".item-row");
    e.target.value = (e.target.value + lines[0]).trim();
    lines.slice(1).forEach((l) => (row = addItemRow({ text: l }, row)));
    syncProgressField();
  });

  function syncProgressField() {
    const counting = $("fMeasure").value === "count";
    $("fPctBox").classList.toggle("hidden", counting);
    $("fCountBox").classList.toggle("hidden", !counting);
    $("fSubBox").classList.toggle("hidden", !$("fSubOn").checked);
    $("fCurLabel").textContent = $("fSubOn").checked ? "Đã xong (số đã xem hết)" : "Đang ở";
    const unit = $("fUnit").value.trim();
    $("fStep").placeholder = defaultStep(unit);
    $("fSubStep").placeholder = defaultStep($("fSubUnit").value.trim() || "phút");
    $("fSubCurLabel").textContent = unit ? `Đang ở (${unit} ${Math.floor(num($("fCur").value)) + 1})` : "Đang ở";
    if (counting) {
      const fake = readCountFields();
      $("fCountHelp").textContent = num(fake.total) > 0
        ? `→ ${progressOf(fake)}% · ${fmtNum(countValue(fake))}/${fmtNum(num(fake.total))} ${fake.unit}`
        : "Nhập tổng số (ví dụ sách 228 trang, phim 16 tập).";
    }
    const it = readItems();
    const auto = it.length > 0;
    $("fProgress").disabled = auto;
    $("fProgVal").textContent = auto
      ? Math.round((it.filter((i) => i.done).length / it.length) * 100) + "% (tự tính theo việc con)"
      : $("fProgress").value + "%";
  }

  function readCountFields() {
    const sub = $("fSubOn").checked && num($("fSubTotal").value) > 0
      ? { current: num($("fSubCur").value), total: num($("fSubTotal").value), unit: $("fSubUnit").value.trim() || "phút", step: num($("fSubStep").value) || "" }
      : null;
    return {
      measure: "count",
      current: num($("fCur").value),
      total: num($("fTotal").value),
      unit: $("fUnit").value.trim() || "trang",
      step: num($("fStep").value) || "",
      sub,
    };
  }
  ["fMeasure", "fCur", "fTotal", "fUnit", "fStep", "fSubOn", "fSubCur", "fSubTotal", "fSubUnit", "fSubStep"].forEach((k) =>
    $(k).addEventListener("input", syncProgressField));
  $("fMeasure").addEventListener("change", syncProgressField);
  $("fSubOn").addEventListener("change", () => {
    if ($("fSubOn").checked && !$("fSubUnit").value) $("fSubUnit").value = "phút";
    syncProgressField();
  });

  $("btnAdd").onclick = () => openForm(null);
  $("fCancel").onclick = () => $("form").classList.add("hidden");
  $("fProgress").oninput = syncProgressField;
  $("fSave").onclick = async () => {
    const title = $("fTitle").value.trim();
    if (!title) return msg("Nhập tên công việc", "err");
    const groupVal = $("fGroupSel").value === "__new__" ? $("fGroupNew").value.trim() : $("fGroupSel").value;
    if ($("fGroupSel").value === "__new__" && !groupVal) return msg("Nhập tên nhóm mới", "err");
    const data = {
      title,
      group: groupVal,
      priority: $("fPriority").value,
      deadline: $("fDeadline").value,
      time: $("fDeadline").value ? getTime() : "",
      repeat: $("fRepeat").value,
      remindBefore: Math.max(0, parseInt($("fRemind").value, 10) || 0),
      progress: +$("fProgress").value,
      items: readItems(),
      note: $("fNote").value.trim(),
    };
    if (data.repeat && !data.deadline) return msg("Việc lặp lại cần có deadline", "err");
    {
      const today = todayStr();
      const dates = [["Deadline", data.deadline], ...data.items.map((i) => [`Việc con “${i.text}”`, i.deadline])].filter(([, d]) => d);
      for (const [who, d] of dates) {
        const diff = daysBetween(today, d);
        if (diff < -365 || diff > 3650) {
          if (!confirm(`${who}: ngày ${fmt(d)} ${diff < 0 ? "đã qua hơn 1 năm" : "xa hơn 10 năm"}, có thể bị nhầm năm.\nBấm Hủy để sửa lại, OK để vẫn lưu.`)) return;
        }
      }
    }
    if ($("fMeasure").value === "count") {
      const c = readCountFields();
      if (!(c.total > 0)) return msg("Nhập tổng số (ví dụ 228 trang)", "err");
      if ($("fSubOn").checked && !(c.sub && c.sub.total > 0)) return msg("Nhập độ dài phần đang dở (ví dụ 48 phút)", "err");
      c.current = Math.min(c.current, c.total);
      Object.assign(data, c);
      // Mốc bắt đầu để tính "đang chậm/đúng tiến độ": đặt lại khi mới chuyển sang đo số lượng hoặc đổi tổng/deadline
      const old = editingId && byId(tasks, editingId);
      if (!old || old.measure !== "count" || num(old.total) !== c.total || old.deadline !== data.deadline || !old.startDate) {
        data.startDate = todayStr();
        data.startValue = c.current;
      }
    } else {
      data.measure = "";
    }
    const id = editingId || uid();
    const isNew = !editingId;
    $("form").classList.add("hidden");
    if (groupVal) pref.set("lastGroup", groupVal);
    await mutate((list, gs) => {
      if (groupVal && !gs.includes(groupVal)) gs.push(groupVal);
      const t = byId(list, id);
      if (t) Object.assign(t, data);
      else list.push({ id, createdAt: new Date().toISOString(), ...data });
    }, (isNew ? "Thêm: " : "Sửa: ") + title);
  };

  // ---------- Thao tác trên thẻ ----------
  $("list").addEventListener("click", async (e) => {
    const el = e.target.closest("[data-act]");
    if (!el || saving) return;
    e.preventDefault();
    const id = el.closest(".task").dataset.id;
    const t = byId(tasks, id);
    if (!t) return;
    const act = el.dataset.act;
    if (act === "edit") return openForm(t);
    if (act === "del") {
      if (!confirm(`Xóa “${t.title}”?`)) return;
      return mutate((list) => { const i = list.findIndex((x) => x.id === id); if (i >= 0) list.splice(i, 1); }, "Xóa: " + t.title, "Đã xóa ✓");
    }
    if (act === "item") {
      const n = +el.dataset.n;
      return mutate((list) => { const x = byId(list, id); if (x && x.items?.[n]) x.items[n].done = !x.items[n].done; }, "Việc con: " + t.title);
    }
    if (isCount(t) && ["cplus", "cminus", "splus", "snext", "done", "reopen"].includes(act)) {
      let info = "";
      const ok = await mutate((list) => {
        const x = byId(list, id);
        if (x && applyCount(x, act) === "next") info = ` Sang ${subLabel(x).toLowerCase()}.`;
      }, `Tiến độ: ${t.title}`, "");
      const x = byId(tasks, id);
      if (ok && x) msg(isDone(x) ? `Đã xong “${x.title}” ✓${x.repeat ? " Đã tạo kỳ tiếp theo." : ""}` : `“${x.title}”: ${fmtNum(num(x.current))}/${fmtNum(num(x.total))} ${x.unit} ✓${info}`);
      return;
    }
    const step = { plus: 10, minus: -10 }[act];
    if (step) return mutate((list) => { const x = byId(list, id); if (x) x.progress = Math.max(0, Math.min(100, (+x.progress || 0) + step)); }, `Tiến độ: ${t.title}`);
    if (act === "done") {
      if (usesItems(t) && !allItemsDone(t) && !confirm(`Còn ${items(t).filter((i) => !i.done).length} việc con chưa xong. Đánh dấu xong cả việc (tích hết việc con)?`)) return;
      return mutate((list) => {
        const x = byId(list, id);
        if (!x) return;
        x.progress = 100;
        if (items(x).length) { x.items.forEach((i) => (i.done = true)); x.done = true; }
      }, "Xong: " + t.title, t.repeat ? "Đã xong ✓ Đã tạo kỳ tiếp theo" : "Đã xong ✓");
    }
    if (act === "reopen") return mutate((list) => { const x = byId(list, id); if (x) { x.progress = 0; x.done = false; } }, "Mở lại: " + t.title);
  });

  // Gõ số trực tiếp: "Đang ở" trang/tập, hoặc phút đang dở
  $("list").addEventListener("change", async (e) => {
    const inp = e.target.closest("input.cnum");
    if (!inp || saving) return;
    const id = inp.closest(".task").dataset.id;
    const t = byId(tasks, id);
    if (!t || inp.value === "") return render();
    const v = +inp.value;
    let info = "";
    const ok = await mutate((list) => {
      const x = byId(list, id);
      if (x && applyCount(x, inp.dataset.k === "sub" ? "sset" : "cset", v) === "next") info = ` Sang ${subLabel(x).toLowerCase()}.`;
    }, `Tiến độ: ${t.title}`, "");
    const x = byId(tasks, id);
    if (ok && x) msg(isDone(x) ? `Đã xong “${x.title}” ✓` : `Đã lưu ✓${info}`);
  });
  $("list").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("input.cnum")) e.target.blur(); });

  // ---------- Quản lý nhóm ----------
  $("btnGroups").onclick = () => {
    $("groupMgr").classList.toggle("hidden");
    render();
    if (!$("groupMgr").classList.contains("hidden")) $("gmNew").focus();
  };
  $("gmClose").onclick = () => $("groupMgr").classList.add("hidden");
  async function addGroup() {
    const name = $("gmNew").value.trim();
    if (!name) return msg("Nhập tên nhóm", "err");
    if (name === NO_GROUP) return msg("Tên này đã được dùng sẵn, chọn tên khác", "err");
    if (realGroups().includes(name)) return msg(`Đã có nhóm “${name}”`, "err");
    $("gmNew").value = "";
    pref.set("lastGroup", name);
    await mutate((list, gs) => { if (!gs.includes(name)) gs.push(name); }, "Thêm nhóm: " + name, `Đã tạo nhóm “${name}” ✓`);
  }
  $("gmAdd").onclick = addGroup;
  $("gmNew").addEventListener("keydown", (e) => { if (e.key === "Enter") addGroup(); });
  $("gmList").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-gm]");
    if (!b || saving) return;
    const name = b.closest(".gm-row").dataset.name;
    const act = b.dataset.gm;
    if (act === "new") {
      $("groupMgr").classList.add("hidden");
      openForm(null);
      fillGroupSelect(name);
      return;
    }
    if (act === "rename") {
      const to = (prompt(`Đổi tên nhóm “${name}” thành:`, name) || "").trim();
      if (!to || to === name) return;
      if (to === NO_GROUP) return msg("Tên này đã được dùng sẵn, chọn tên khác", "err");
      const merge = realGroups().includes(to);
      if (merge && !confirm(`Đã có nhóm “${to}”. Gộp toàn bộ việc của “${name}” vào “${to}”?`)) return;
      if (group === name) { group = to; pref.set("group", to); }
      if (pref.get("lastGroup", "") === name) pref.set("lastGroup", to);
      return mutate((list, gs) => {
        list.forEach((t) => { if ((t.group || "").trim() === name) t.group = to; });
        const i = gs.indexOf(name);
        if (i >= 0) gs.splice(i, 1);
        if (!gs.includes(to)) gs.push(to);
      }, `Đổi tên nhóm: ${name} → ${to}`, merge ? `Đã gộp vào “${to}” ✓` : `Đã đổi tên thành “${to}” ✓`);
    }
    if (act === "del") {
      const n = tasks.filter((t) => groupOf(t) === name).length;
      if (!confirm(`Xóa nhóm “${name}”?${n ? `\n${n} việc trong nhóm sẽ chuyển sang “${NO_GROUP}” (không bị xóa).` : ""}`)) return;
      return mutate((list, gs) => {
        list.forEach((t) => { if ((t.group || "").trim() === name) t.group = ""; });
        const i = gs.indexOf(name);
        if (i >= 0) gs.splice(i, 1);
      }, "Xóa nhóm: " + name, `Đã xóa nhóm “${name}” ✓`);
    }
  });

  // ---------- Nút bấm từ email: ?act=plus|done&id=... ----------
  async function handleLinkAction() {
    const p = new URLSearchParams(location.search);
    const act = p.get("act"), id = p.get("id");
    if (!act || !id) return;
    history.replaceState(null, "", location.pathname);
    const t = byId(tasks, id);
    if (!t) return msg("Không tìm thấy việc này, có thể nó đã bị xóa.", "err");
    if (isDone(t)) return msg(`“${t.title}” đã xong từ trước.`);
    if (act === "done") {
      await mutate((list) => {
        const x = byId(list, id);
        if (!x) return;
        if (items(x).length) x.items.forEach((i) => (i.done = true));
        if (isCount(x)) applyCount(x, "done");
        if (items(x).length) x.done = true;
        x.progress = 100;
      }, "Xong (từ email): " + t.title, `Đã đánh dấu xong “${t.title}” ✓${t.repeat ? " Đã tạo kỳ tiếp theo." : ""}`);
    } else if (isCount(t) && (act === "plus" || act === "splus")) {
      let info = "";
      const ok = await mutate((list) => {
        const x = byId(list, id);
        if (x && applyCount(x, act === "plus" ? "cplus" : "splus") === "next") info = ` Sang ${subLabel(x).toLowerCase()}.`;
      }, "Tiến độ (từ email): " + t.title, "");
      const x = byId(tasks, id);
      if (ok && x) msg(isDone(x) ? `Đã xong “${x.title}” ✓` : `“${x.title}”: ${fmtNum(num(x.current))}/${fmtNum(num(x.total))} ${x.unit}${hasSub(x) ? ` · ${subLabel(x)}: ${fmtNum(num(x.sub.current))}/${fmtNum(num(x.sub.total))} ${x.sub.unit}` : ""} ✓${info}`);
    } else if (act === "plus" && usesItems(t) && allItemsDone(t)) {
      msg(`“${t.title}”: đã xong hết việc con. Bấm “✓ Xong cả việc” nếu việc này đã hoàn tất.`);
    } else if (act === "plus") {
      const ok = await mutate((list) => {
        const x = byId(list, id);
        if (!x) return;
        const next = items(x).find((i) => !i.done);
        if (next) next.done = true;
        else x.progress = Math.min(100, (+x.progress || 0) + 25);
      }, "Tiến độ (từ email): " + t.title, "");
      const now = byId(tasks, id);
      if (ok && now) msg(`“${now.title}”: tiến độ ${progressOf(now)}% ✓`);
    }
  }

  // ---------- Khởi động ----------
  setView(view);
  (async () => {
    if (!configured) {
      msg("Website chưa được cấu hình: thiếu secret DATA_TOKEN hoặc chưa chạy workflow dựng website.", "err");
      return render();
    }
    try {
      await fetchRemote();
    } catch (e) {
      msg("Không tải được danh sách việc: " + e.message, "err");
    }
    render();
    await handleLinkAction();
  })();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
