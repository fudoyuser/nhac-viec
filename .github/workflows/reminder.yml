name: Gửi mail nhắc việc

on:
  schedule:
    # Giờ UTC. Việt Nam = UTC+7.
    # 7h, 9h, 12h, 15h, 18h, 20h, 22h giờ VN (chạy ở phút 05)
    - cron: "5 0,2,5,8,11,13,15 * * *"
  workflow_dispatch:       # cho phép bấm "Run workflow" để gửi ngay
    inputs:
      mode:
        description: "Loại mail (auto: 7h bản đầy đủ, tối Chủ nhật báo cáo tuần, còn lại chỉ việc gấp)"
        type: choice
        options: [full, urgent, weekly, auto]
        default: full

permissions:
  contents: read
  actions: write   # để giữ lịch chạy không bị GitHub tắt sau 60 ngày

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lấy danh sách việc từ repo dữ liệu
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}-data
          token: ${{ secrets.DATA_TOKEN }}
          path: data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Gửi mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TASKS_FILE: data/tasks.json
          MODE: ${{ inputs.mode || 'auto' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/send_reminder.py
      - name: Giữ lịch chạy luôn bật
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/reminder.yml/enable" || true
