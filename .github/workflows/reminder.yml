name: Gửi mail nhắc việc

on:
  schedule:
    # Giờ UTC. Việt Nam = UTC+7.
    - cron: "5 0 * * *"    # 7:05 sáng
    - cron: "5 13 * * *"   # 20:05 tối
  workflow_dispatch: {}    # cho phép bấm "Run workflow" để gửi ngay

permissions:
  contents: read
  actions: write   # để giữ lịch chạy không bị GitHub tắt sau 60 ngày

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lấy danh sách việc từ repo dữ liệu
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-data
          token: ${{ secrets.DATA_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gửi mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TASKS_FILE: data/tasks.json
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/send_reminder.py
      - name: Giữ lịch chạy luôn bật
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/reminder.yml/enable" || true
